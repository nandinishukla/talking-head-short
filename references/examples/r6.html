<script>
const $ = (id) => document.getElementById(id);
const inner = (t) => E.kf(t, [[0, { x: 516, y: 480, s: 1.08 }], [4.84, { x: 516, y: 480, s: 1.08 }], [5.44, { x: 516, y: 700, s: 1.08 }, 'p2io'], [6.62, { x: 516, y: 700, s: 1.08 }], [7.22, { x: 516, y: 560, s: 1.0 }, 'p2io']]);
const mbNode = $('mb'), K = 0.29 * 0.75 / 60;
