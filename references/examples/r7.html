<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=1080, height=1920">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<link rel="stylesheet" href="../assets/base.css"><script src="../assets/engine.js"></script>
<style>
  #term { left: 50px; top: 200px; width: 980px; height: 540px; padding: 48px 54px; }
  #tlines { font-family: Plex; font-size: 34px; line-height: 1.8; white-space: pre; letter-spacing: -0.02em; }
  #tlines .p { color: var(--clayText); }
  #tlines .d { color: #8a877f; }
  #dash { left: 50px; top: 1110px; width: 980px; height: 760px; border-radius: 40px; overflow: hidden; background: #F8F7F6; }
  #dash .hv-head { width: 980px; }
  #dash .pg { position: absolute; left: 0; top: 128px; right: 0; padding: 36px 48px; }
  #dash .ttl { font-family: Garamond; font-size: 76px; line-height: 1.1; }
  .stat { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px solid #E6E3DE; padding: 20px 0; font-family: Inter; font-size: 34px; }
  .stat b { font-family: Plex; font-weight: 500; font-size: 44px; }
  .stats { margin-top: 20px; }
  #pulse { position: absolute; width: 16px; height: 16px; border-radius: 50%; border: 3px solid var(--green); }
</style></head>
<body>
<div id="root" class="split" data-composition-id="r7" data-start="0" data-duration="4.95" data-width="1080" data-height="1920">
  <svg class="defs"><filter id="mbf" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur id="mb" stdDeviation="0 0"/></filter></svg>
  <div class="viewport" id="vp"><div class="world" id="world">
    <div class="obj card doc" id="term"><div id="tlines"></div></div>
    <div class="obj card" id="dash">
      <div class="hv-head"><div class="hv-mark">H</div><div><div class="hv-name">Harvey</div><div class="hv-tag">Always Be Closing</div></div><div class="hv-status"><span class="dot" id="dot"></span>Harvey is online</div></div>
      <div class="pg"><div class="ttl">Today</div>
        <div class="stats">
          <div class="stat"><span>Companies</span><b id="s0"></b></div>
          <div class="stat"><span>Contacts</span><b id="s1"></b></div>
          <div class="stat"><span>Awaiting approval</span><b id="s2"></b></div>
          <div class="stat"><span>Live conversations</span><b id="s3"></b></div>
        </div></div>
    </div>
  </div></div>
</div>
<script type="application/json" id="events">[{"t":0.12,"t1":2.4,"type":"ticks"},{"t":3.0,"type":"pop"}]</script>
<script>
const $ = (id) => document.getElementById(id);
const cam = E.path({ x: 540, y: 470, s: 1 }, [
  { t0: 0, t1: 2.5, to: { x: 540, y: 470, s: 1.035 }, ease: 'sio' },          // glide while the loop runs
  { t0: 2.76, t1: 3.26, to: { x: 540, y: 1470, s: 1.0 }, ease: 'p3io' },       // step to the dashboard ("watch")
  { t0: 3.3, t1: 4.95, to: { x: 540, y: 1500, s: 1.1 }, ease: 'p2io' },       // push onto the live numbers
]);
const camera = E.camera({ world: $('world'), viewport: $('vp'), blurNode: $('mb'), fx: 540, fy: 470, cam });
// README's own `harvey run` output, looping back to the next cycle
const TL = [
  ['p', '$ harvey run', -1],
  ['', 'Harvey is online. Always Be Closing.', 0.12],
  ['d', 'Checking pipeline state...', 0.55],
  ['', 'Decision: prospect', 0.95],
  ['', 'Cycle complete. Sleeping for 15 minutes.', 1.35],
  ['d', 'Checking pipeline state...', 2.05],
];
const tgt = [41, 26, 12, 3];
function render(t) {
  camera(t);
  let h = '';
  for (const [cls, s, t0] of TL) { const v = t0 < 0 ? s : E.typed(s, t0, 80, t); if (v) h += `<span class="${cls}">${v}</span>\n`; }
  $('tlines').innerHTML = h;
  E.track($('term'), t, { o: [[2.76, 1], [3.26, 0.4]], b: [[2.76, 0], [3.26, 9]] });
  E.track($('dash'), t, E.land(2.7));
  tgt.forEach((v, i) => { const k = E.kf(t, [[3.3 + i * 0.1, 0.6], [4.4 + i * 0.1, 1, 'p2o']]); $('s' + i).textContent = Math.round(v * k); });
  const ph = ((t * 1.4) % 1);
  $('dot').style.boxShadow = `0 0 0 ${(ph * 14).toFixed(1)}px rgba(52,199,89,${(0.45 * (1 - ph)).toFixed(3)})`;
}
E.run('r7', 4.95, render);
</script>
</body></html>
