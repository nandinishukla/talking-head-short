<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=1080, height=1920">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<link rel="stylesheet" href="../assets/base.css"><link rel="stylesheet" href="../assets/motion/explain.css">
<script src="../assets/engine.js"></script><script src="../assets/motion/core.js"></script><script src="../assets/motion/explain.js"></script>
<style>
  #doc { left: 120px; top: 1040px; width: 840px; height: 300px; padding: 40px 48px; }
  #doc .h { font-family: Garamond; font-size: 60px; } #doc .l { height: 22px; border-radius: 11px; background: #EEEBE5; margin-top: 22px; }
</style></head><body>
<div id="root" data-composition-id="explain-flow" data-start="0" data-duration="4" data-width="1080" data-height="1920"><div id="stage" style="position:absolute;inset:0"></div>
  <div class="obj card doc" id="doc"><div class="h">Outbox</div><div class="l" style="width:80%"></div><div class="l" style="width:62%"></div><div class="l" style="width:70%"></div></div>
</div>
<script type="application/json" id="events">[{"t":0.3,"type":"pop"},{"t":0.9,"type":"pop"},{"t":1.7,"type":"pop"},{"t":2.55,"type":"pop"}]</script>
<script>
// research -> AI -> cold email: tiles pop (tilted spring), arrows draw in the direction of flow, then the product card lands
const S = document.getElementById('stage');
const SPARK = '<svg width="78" height="78" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.3" stroke-linecap="round">' + [0,1,2,3,4,5].map(i => { const a = i * Math.PI / 6; return '<path d="M' + (12 - 9 * Math.cos(a)).toFixed(2) + ' ' + (12 - 9 * Math.sin(a)).toFixed(2) + 'L' + (12 + 9 * Math.cos(a)).toFixed(2) + ' ' + (12 + 9 * Math.sin(a)).toFixed(2) + '"/>'; }).join('') + '</svg>';
const T = [E.iconTile(S, 'doc', 'research'), E.iconTile(S, '', 'AI', { hero: true, svg: SPARK }), E.iconTile(S, 'mail', 'cold email')];
const X = [140, 440, 740]; T.forEach((n, i) => { n.style.left = X[i] + 'px'; n.style.top = '600px'; });
const A = [E.arrowEl(S, 80, 'right'), E.arrowEl(S, 80, 'right')]; A.forEach((a, i) => { a.style.left = (X[i] + 210) + 'px'; a.style.top = '680px'; });
function render(t) {
  E.iconPop(T[0], t, 0.2, { rot: 0 }); E.arrowDraw(A[0], t, 0.62); E.iconPop(T[1], t, 0.8); E.arrowDraw(A[1], t, 1.42); E.iconPop(T[2], t, 1.6, { rot: 10 });
  E.track(document.getElementById('doc'), t, E.land(2.25));
}
E.run('explain-flow', 4, render);
</script></body></html>
