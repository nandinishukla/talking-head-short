<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=1080, height=1920">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<link rel="stylesheet" href="../assets/base.css"><script src="../assets/engine.js"></script>
<script src="../assets/motion/core.js"></script><script src="../assets/motion/text.js"></script>
<style>
  #card { left: 90px; top: 330px; width: 900px; height: 760px; padding: 64px 70px; }
  #num { position: absolute; left: 70px; top: 170px; font-size: 330px; font-weight: 700; line-height: 1; letter-spacing: -0.04em; color: var(--clayText); }
  #bar { position: absolute; left: 70px; right: 70px; bottom: 150px; height: 28px; border-radius: 14px; background: #EFECE6; overflow: hidden; }
  #bar b { display: block; height: 100%; border-radius: 14px; background: var(--clay); }
  #cap { position: absolute; left: 70px; bottom: 64px; color: #555; }
</style></head>
<body>
<div id="root" data-composition-id="kinetic" data-start="0" data-duration="3.6" data-width="1080" data-height="1920">
  <div class="obj card doc" id="card">
    <div class="h2">Reply rate</div>
    <div id="num"></div>
    <div id="bar"><b id="fill"></b></div>
    <div class="body" id="cap">first week, 12 emails</div>
  </div>
</div>
<script type="application/json" id="events">[{"t":0.6,"t1":1.7,"type":"ticks"}]</script>
<script>
const $ = (id) => document.getElementById(id);
function render(t) {
  // the number grows out of its baseline-left point while it counts to 62 on expo.out
  const v = E.kineticNumber($('num'), t, { t0: 0.6, to: 62, dur: 1.3, suffix: '%', origin: '0% 85%' });
  $('fill').style.width = v.toFixed(2) + '%';
}
E.run('kinetic', 3.6, render);
</script>
</body></html>
