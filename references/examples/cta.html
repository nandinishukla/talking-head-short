<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=1080, height=1920">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<link rel="stylesheet" href="../assets/base.css"><script src="../assets/engine.js"></script>
<style>
  html, body { background: transparent !important; }
  #root { background: none !important; }
  #box { left: 43px; top: 1344px; width: 994px; height: 276px; border-radius: 40px; display: flex; align-items: center; gap: 30px; padding: 0 40px; }
  .av { width: 130px; height: 130px; border-radius: 50%; background: #D9D9DE; position: relative; overflow: hidden; flex: none; }
  .av::before { content: ''; position: absolute; left: 41px; top: 24px; width: 48px; height: 48px; border-radius: 50%; background: #fff; }
  .av::after { content: ''; position: absolute; left: 20px; top: 82px; width: 90px; height: 80px; border-radius: 50%; background: #fff; }
  .field { flex: 1; height: 112px; border-radius: 56px; background: #F3F3F0; display: flex; align-items: center; padding: 0 36px; font-size: 52px; font-weight: 600; }
  .field .ph { color: #9a988f; font-weight: 400; }
  #post { flex: none; height: 112px; padding: 0 44px; border-radius: 56px; background: var(--clay); color: #fff; font-size: 44px; font-weight: 700; display: flex; align-items: center; }
</style></head>
<body>
<div id="root" data-composition-id="cta" data-start="0" data-duration="5.133" data-width="1080" data-height="1920">
  <div class="obj card" id="box">
    <div class="av"></div>
    <div class="field" id="field"></div>
    <div class="obj" id="post" style="position:relative">Post</div>
  </div>
</div>
<script type="application/json" id="events">[{"t":0.42,"t1":0.92,"type":"keys","n":6},{"t":1.32,"type":"click"}]</script>
<script>
const $ = (id) => document.getElementById(id);
function render(t) {
  E.track($('box'), t, { o: [[0, 1]], y: [[0, 0]] });
  const s = E.typed('Harvey', 0.42, 12, t);
  const posted = t >= 1.36;
  $('field').innerHTML = s ? s + E.caret(t, !posted) : '<span class="ph">Add a comment…</span>' + E.caret(t, true);
  // Post button press: down 80 ms, release 180 ms
  E.track($('post'), t, { s: [[1.24, 1], [1.32, 0.9, 'p2o'], [1.5, 1, 'p2o']] });
  $('post').style.filter = t >= 1.32 && t < 1.5 ? 'brightness(0.9)' : 'none';
}
E.run('cta', 5.133, render);
</script>
</body></html>
